<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes</title>
    <link rel ="stylesheet" href="index.css"> 
    <script src="index.js" defer></script>
</head>
<body>
    
    <header>
        <h1>Quick Notes</h1>
        <div>
            <button class="add-note-btn" onclick="openNoteDialog()">➕</button>
            <button id="themeToggleBtn" class="theme-toggle-btn">🌙</button>
        </div>
    </header>

    <main id="notesContainer" class="notes-grid"></main>

    <dialog id="noteDialog">
        <div class="mainDialog">
            <div class="dialog-content">
                <div class="dialog-header">
                    <h2 class="dialog-title" id="dialogTitle"></h2>
                    <button class="close-btn" onclick="closeNoteDialog()">x</button>
                </div>
                <form id="noteForm">
                    <div id="noteTitle">
                        <label class="form-label">Title</label>
                        <input type="text"placeholder="Enter note title..." id="noteTitleField" class="form-Title" required>
                    </div>
                    <div id="note-content">
                        <label class="form-label">content</label>
                        <textarea placeholder="Enter content title..." id="noteContent" class="form-TextArea"></textarea>
                    </div>
                    <div class="dialog-actions">
                        <button type="button" class="cancel-btn" onclick="closeNoteDialog()">Cancel</button>
                        <button type="submit" class="save-btn">Save Note</button>
                    </div>
                </form>
            </div>
        </div>
    </dialog>


    <dialog id="noteDialog2">
        <div class="mainDialog">
            <div class="dialog-content">
                <div class="dialog-header">
                    <h2 class="note-title" id="ex-Title"></h2>
                    <button class="close-btn" onclick="closeNoteDialog2()">x</button>
                </div>
                <div id="noteForm">
                        <p  id="ex-Content"></p>
                        <button type="button" class="cancel-btn" onclick="closeNoteDialog2()">Close</button>
                        
                </div>
            </div>
        </div>
    </dialog>



    
</body>
</html>
