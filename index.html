<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes</title>
    <link rel ="stylesheet" href="index.css"> 
</head>
<body>
    
    <header>
        <h1>Quick Notes</h1>
        <div>
            <button class="add-note-btn" onclick="openNoteDialog()">➕New Note</button>
            <button id="themeToggleBtn" class="theme-toggle-btn">🌙</button>
        </div>
    </header>

    <main id="notesContainer" class="notes-grid"></main>

    <dialog id="noteDialog">
        <div class="dialog-content">
            <div class="dialog-header">
                <h2 class="dialog-title" id="dialogTitle">Add New Note</h2>
                <button class="close-btn" onclick="closeNoteDialog()">❌</button>
            </div>
            <form id="noteForm">
                <div id="noteTitle">
                    <h3 class="form-label">Title</h3>
                    <input type="text"placeholder="Enter note title..." id="noteTitleField" class="form-Title" required>
                </div>
                <div id="notecontent">
                    <h3 class="form-label">content</h3>
                    <textarea placeholder="Enter content title..." id="noteContent" class="form-TextArea"></textarea>
                </div>
                <div class="dialog-actions">
                    <button type="button" class="cancel-btn" onclick="closeNoteDialog()">Cancel</button>
                    <button type="submit" class="save-btn">Save Note</button>
                </div>
            </form>
        </div>
    </dialog>



    <script src="index.js"></script>
</body>
</html>
